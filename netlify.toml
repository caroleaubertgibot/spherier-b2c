# Seul le contenu de public/ est servi au navigateur. Le template, les scripts de
# build et le code des fonctions restent hors du site public : les fonctions sont
# exécutées côté serveur, elles n'ont jamais à être téléchargeables.
[build]
  publish = "public"
  functions = "netlify/functions"

[dev]
  framework = "#static"
  publish = "public"

# Chemins courts côté navigateur, indépendants de l'emplacement des fonctions.
[[redirects]]
  from = "/api/referential"
  to = "/.netlify/functions/referential"
  status = 200

[[redirects]]
  from = "/api/refresh"
  to = "/.netlify/functions/refresh"
  status = 200

[[redirects]]
  from = "/api/state"
  to = "/.netlify/functions/state"
  status = 200

[[redirects]]
  from = "/api/snapshot"
  to = "/.netlify/functions/snapshot"
  status = 200

# Contrats v1, conservés tant que le renderer actuel n'est pas remplacé (phase 3).
[[redirects]]
  from = "/api/snapshot-latest"
  to = "/.netlify/functions/snapshot-latest"
  status = 200

[[redirects]]
  from = "/api/snapshot-save"
  to = "/.netlify/functions/snapshot-save"
  status = 200

# La racine sert le sphérier sans redirection visible : https://<site>/?c=<uuid>
# fonctionne donc aussi bien que /spherier.html?c=<uuid>.
[[redirects]]
  from = "/"
  to = "/spherier.html"
  status = 200
